name=TinyMQ
version=0.0.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=Portable MQTT for Arduino: a client and a broker, MQTT 3.1.1 / 5.0 over TCP and MQTT-SN 1.2 over UDP.
paragraph=An MQTT library that is not tied to one core. TinyMQClient talks MQTT over any Arduino Client; TinyMQClientSn talks MQTT-SN over any Arduino UDP for the smallest chips; TinyMQBroker relays TCP and MQTT-SN clients in one topic space, with QoS 0/1/2, retained messages, wills, persistent sessions and bridges, and features can be stripped at build or run time. The protocol core has no lwIP or Arduino dependency. MIT.
category=Communication
